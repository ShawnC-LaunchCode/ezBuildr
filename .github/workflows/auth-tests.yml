name: Auth Tests

# Enforces the per-service coverage thresholds in vitest.config.auth.ts
# (statements/lines 80, functions 80, branches 75) on AuthService, MfaService and
# AccountLockoutService. The main suite runs these same three files, but its own
# thresholds are repo-wide and deliberately low, so this is the only gate holding
# the auth services to a real number.
#
# This workflow used to have two further jobs, removed 2026-08-06:
#
#   auth-integration-tests / auth-coverage ran vitest.config.integration.ts,
#   whose five *.real.test.ts files need real external credentials. vitest.config.ts
#   excludes exactly that pattern for the same reason, so those jobs could never
#   pass in CI — and between them and the broken VL_MASTER_KEY below, this workflow
#   had failed on every push since at least 2026-07-14. The .real files are kept
#   and remain runnable locally with credentials:
#       npm run test:auth:integration
#
#   auth-test-summary aggregated the three jobs and reported "✅ Completed" whenever
#   an artifact merely existed, so a failed run still summarised as a pass.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/services/AuthService.ts'
      - 'server/services/MfaService.ts'
      - 'server/services/AccountLockoutService.ts'
      - 'tests/unit/services/AuthService.test.ts'
      - 'tests/unit/services/MfaService.test.ts'
      - 'tests/unit/services/AccountLockoutService.test.ts'
      - 'tests/setup.auth.ts'
      - 'vitest.config.auth.ts'
      - '.github/workflows/auth-tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/services/AuthService.ts'
      - 'server/services/MfaService.ts'
      - 'server/services/AccountLockoutService.ts'
      - 'tests/unit/services/AuthService.test.ts'
      - 'tests/unit/services/MfaService.test.ts'
      - 'tests/unit/services/AccountLockoutService.test.ts'
      - 'tests/setup.auth.ts'
      - 'vitest.config.auth.ts'
      - '.github/workflows/auth-tests.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  auth-unit-tests:
    name: Auth Unit Tests + Coverage
    runs-on: ubuntu-latest

    # No postgres service and no db:migrate step: vitest.config.auth.ts runs three
    # unit files whose repositories are mocked, and tests/setup.auth.ts touches no
    # database. Verified by running the suite with DATABASE_URL pointed at an
    # unreachable host — 3 files / 158 tests still pass.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auth Service Unit Tests with Coverage
        run: npm run test:auth:coverage -- --reporter=verbose --reporter=json --outputFile=auth-unit-results.json
        env:
          NODE_ENV: test
          JWT_SECRET: "test-jwt-secret-minimum-32-characters-long-for-ci"
          # MUST decode to exactly 32 bytes — MfaService encrypts the TOTP secret
          # with it, and a wrong length throws. The value here previously decoded
          # to 41 bytes ("test-master-key-32-bytes-long-for-testing"), which is
          # what failed two MfaService cases on every run. This is a throwaway CI
          # key, not a secret; tests/setup.auth.ts has its own valid fallback if
          # the variable is unset entirely.
          VL_MASTER_KEY: ${{ secrets.VL_MASTER_KEY_TEST || 'Y2ktdGVzdC1rZXktbm90LWEtcmVhbC1zZWNyZXQtMzI=' }}

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-unit-test-results
          path: auth-unit-results.json
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-coverage-report
          path: coverage/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          echo "# 🔐 Auth Service Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            jq -r '
              .total |
              "| Metric | Coverage |\n" +
              "|--------|----------|\n" +
              "| Lines | \(.lines.pct)% |\n" +
              "| Statements | \(.statements.pct)% |\n" +
              "| Functions | \(.functions.pct)% |\n" +
              "| Branches | \(.branches.pct)% |"
            ' coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not found — the test step failed before writing it." >> $GITHUB_STEP_SUMMARY
          fi
