name: Deployment Safety Check

# Runs on every branch in the promotion chain (dev -> test -> main), not just
# main. When this gated main alone, a break could sit undetected on dev and test
# and only announce itself once it had already reached the branch that deploys:
# the PdfConverter env-leak failed six consecutive main builds that way, having
# passed nothing earlier because nothing earlier ran.
#
# The Slack header labels itself from GITHUB_REF_NAME (scripts/ci/build-slack-
# payload.js), so dev and test builds identify themselves with no further change.
on:
  push:
    branches: [ "main", "test", "dev" ]
  pull_request:
    branches: [ "main", "test" ]

jobs:
  # Blocking quality gates. Keep type-check and lint green before deployment.
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Label deliberately carries no version number: it said "20.x" for a while
    # after the pin below moved to 24.x, and the checks list shows the step name,
    # so the run looked like it was still on Node 20 when it was not.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # `npm run lint` is repo-wide and took 187s uncached (measured 2026-09-05);
    # with a warm ESLint cache the same run is ~4s. The cache is safe to restore
    # across runs: --cache-strategy content hashes file CONTENT (not mtime, which
    # checkout rewrites), and ESLint stores a per-file config hash alongside it,
    # so an entry whose file or config changed is re-linted rather than trusted.
    # The key still busts on any config or dependency change, because a plugin
    # version bump can change results without changing the config object.
    #
    # Deliberately NOT caching .tsbuildinfo here. Type-check is 40s cold / 9s
    # warm on a job that is not the critical path (Tests is), so the upside is
    # ~30s — and a stale TypeScript build cache in this repo has produced false
    # GREENS before (see CLAUDE.md on worktrees sharing one tsbuildinfo). A
    # 30-second saving is not worth a type-check that can pass without looking.
    - name: Restore ESLint cache
      uses: actions/cache@v4
      with:
        path: .eslintcache
        key: eslint-${{ runner.os }}-${{ hashFiles('.eslintrc.json', '.eslintignore', 'package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          eslint-${{ runner.os }}-${{ hashFiles('.eslintrc.json', '.eslintignore', 'package-lock.json') }}-

    - name: Type Check
      run: npm run type-check

    - name: Lint
      run: npm run lint --if-present

    - name: Strict Zones Type Check
      run: npm run check:strict-zones

  # Security gate to enforce dependency health and catch committed secrets
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Secret Scanning (gitleaks)
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Label deliberately carries no version number: it said "20.x" for a while
    # after the pin below moved to 24.x, and the checks list shows the step name,
    # so the run looked like it was still on Node 20 when it was not.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Dependency Scanning
      # Fails on any high/critical advisory not documented in .audit-allowlist.json
      # (see SEC-046). Allowlisted entries are justified + expiring, not blanket ignores.
      run: node scripts/ci/audit-check.mjs

    - name: SSRF Guard (Block raw fetch in server)
      # Two files may call fetch directly, and only these two:
      #   safeFetch.ts        - implements the SSRF-safe wrapper itself.
      #   internalService.ts  - the single sanctioned door to operator-configured
      #                         internal infrastructure (e.g. Gotenberg on a
      #                         *.railway.internal address), which safeFetch
      #                         rejects by design because it resolves to a
      #                         private IP. Its signature takes a path, not a
      #                         URL, so a caller cannot redirect the request to
      #                         another host — see that file's header.
      # Callers use internalServiceRequest(); the capital F means this grep
      # still covers them.
      run: |
        if grep -rnw 'server' --exclude='safeFetch.ts' --exclude='internalService.ts' --exclude-dir='tests' -e '\bfetch(' -e '\bawait fetch('; then
          echo "ERROR: Raw fetch found in server/. Use safeFetch (external URLs) or internalServiceRequest (configured internal services) to prevent SSRF."
          exit 1
        fi
        echo "No raw fetch found."

  # Real deployment-safety gate: runs the full test suite against a real
  # Postgres. Independent of the advisory quality job so tests always run.
  test:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespw
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3009:3000
        options: >-
          --health-cmd "curl --fail http://localhost:3000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
    - uses: actions/checkout@v7

    # qpdf is a runtime dependency of the PDF form-filling feature
    # (server/services/document/PdfService.ts unlockPdf → `qpdf --decrypt`).
    # Install it so the PDF tests exercise the real unlock path instead of the
    # missing-binary fallback.
    - name: Install system dependencies (qpdf)
      run: sudo apt-get update && sudo apt-get install -y qpdf

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Setup Database
      # Build the schema by replaying the migration chain (baseline + RLS +
      # functions), the same way prod/tests do — NOT db:push, which syncs from
      # the Drizzle schema and silently skips RLS policies and PL/pgSQL functions.
      run: |
        npm run db:migrate
        npm run db:seed
      env:
        NODE_ENV: test
        DATABASE_URL: "postgresql://postgres:postgrespw@localhost:5432/test_db"

    - name: Run All Tests (Unit + Integration + Auth)
      run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-summary.json
      env:
        NODE_ENV: test
        DATABASE_URL: "postgresql://postgres:postgrespw@localhost:5432/test_db"
        # tests/setup.ts deliberately IGNORES the inherited DATABASE_URL and
        # resolves the test DB from TEST_DATABASE_URL, falling back to a
        # localhost default whose password/db do NOT match this CI service.
        # Without this line every integration test failed to connect (28P01),
        # so the integration suite never actually ran in CI. Point it at the
        # CI postgres service.
        TEST_DATABASE_URL: "postgresql://postgres:postgrespw@localhost:5432/test_db"
        PDF_CONVERTER_API_URL: "http://localhost:3009"
        # Must be >=32 chars — env.ts rejects shorter secrets and, in test mode,
        # only injects a fallback when the var is UNSET (not when set too short).
        SESSION_SECRET: "test-session-secret-minimum-32-characters-long-for-ci"
        JWT_SECRET: "test-jwt-secret-minimum-32-characters-long-for-ci"
        # Use secret or fallback for PRs from forks
        VL_MASTER_KEY: ${{ secrets.VL_MASTER_KEY_TEST || 'dGVzdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWxvbmctZm9yLXRlc3Rpbmc=' }}

    - name: Migration Safety Dry Run
      # This assumes we have a script to dry-run migrations against a schema
      # For now, we'll placeholder this or run the actual migration check script if implemented
      run: echo "Checking migration safety..."

    - name: Slack Notification Suite
      if: always()
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm install
        node scripts/ci/parse-test-results.js
        node scripts/ci/parse-coverage.js
        node scripts/ci/compute-coverage-delta.js
        node scripts/ci/get-file-changes.js
        node scripts/ci/build-slack-payload.js
        node scripts/ci/post-slack-main.js
        node scripts/ci/post-slack-threads.js
